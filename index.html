<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#156b5a"><meta name="description" content="식물과 에너지, 동물과 에너지 과학 암기와 오답 복습"><title>과학 암기장 | 식물과 동물의 에너지</title><link rel="stylesheet" href="style.css"><script defer src="lucide.min.js"></script><script defer src="data.js"></script><script defer src="core.js"></script><script defer src="diagrams.js"></script><script defer src="app.js"></script></head>
<body>
<a class="skip" href="#main">학습으로 바로 가기</a>
<header class="topbar"><div class="brand"><span class="brand-icon"><i data-lucide="sprout"></i></span><div><h1>과학 암기장</h1><p>식물과 에너지 · 동물과 에너지</p></div></div><div class="top-actions"><span id="save-state">이 브라우저에 저장</span><button class="icon-button" id="settings-open" aria-label="학습 기록 설정" title="학습 기록 설정"><i data-lucide="settings-2"></i></button></div></header>
<nav class="tabs" aria-label="학습 메뉴"><button data-view="memory" aria-current="page"><i data-lucide="layers"></i>암기 카드</button><button data-view="notes"><i data-lucide="notebook-pen"></i>핵심 노트</button><button data-view="quiz"><i data-lucide="pencil-line"></i>연습문제</button><button data-view="progress"><i data-lucide="chart-no-axes-combined"></i>학습 기록</button></nav>
<div id="storage-warning" class="warning" hidden></div><main id="main" tabindex="-1"></main>
<footer><span>39장 자료 기준 · 직접 작성한 개념·모식도</span><span>원본 스캔·손글씨 비공개</span></footer>
<dialog id="settings"><form method="dialog"><header><h2>학습 기록</h2><button class="icon-button" aria-label="닫기" title="닫기"><i data-lucide="x"></i></button></header></form><p>기록 저장 위치: 현재 기기의 브라우저</p><p class="muted">다른 기기로 옮길 때는 기록 파일을 내보낸 뒤 불러올 수 있어요. 자동 동기화는 사용하지 않습니다.</p><div class="settings-actions"><button id="export"><i data-lucide="download"></i>기록 내보내기</button><label class="button" for="import"><i data-lucide="upload"></i>기록 불러오기</label><input id="import" type="file" accept="application/json,.json" hidden></div><hr><details><summary>기록 초기화</summary><p class="muted">현재 브라우저의 과학 학습 기록만 지웁니다.</p><button id="reset" class="danger">전체 기록 초기화</button></details></dialog>
<dialog id="confirm"><h2 id="confirm-title">확인</h2><p id="confirm-body"></p><div class="settings-actions"><button id="confirm-cancel">취소</button><button id="confirm-ok" class="primary">확인</button></div></dialog>
<dialog id="diagram-zoom"><form method="dialog"><header><h2>모식도 확대</h2><button class="icon-button" aria-label="확대 그림 닫기" title="닫기"><i data-lucide="x"></i></button></header></form><div class="zoom-scroll"><canvas id="zoom-canvas" role="img"></canvas></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
</body></html>
